name: neobo-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neobo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neobo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-neobo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.6.7-alpine@sha256:7033ad495c19b6bca38aea38f9130d1a3d5b647ac94f3ebe644c8c0fb804e039
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-neobo_dev_redis}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - '127.0.0.1:${REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  postgres-data:
  redis-data:
